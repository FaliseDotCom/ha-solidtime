; Runs the three Solidtime processes that the upstream Docker Compose setup
; spreads over separate containers: the web server, the scheduler and the
; queue worker. run.sh starts this after PostgreSQL is ready; the environment
; it exports is inherited by every program.
;
; supervisord itself runs as root, because only root can open the container's
; stdout for the program logs; every program runs as the `laravel` user.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

; Two web workers are plenty for a household or small team, and keep memory
; use low; the upstream default starts one per CPU core.
[program:web]
command = php /var/www/html/artisan octane:frankenphp --host=0.0.0.0 --port=8000 --admin-host=127.0.0.1 --admin-port=2019 --workers=2 --max-requests=500 --log-level=WARN --caddyfile=/var/www/html/docker/prod/deployment/octane/FrankenPHP/Caddyfile
user = laravel
environment = LARAVEL_OCTANE="1"
priority = 1
autorestart = true
startsecs = 5
stopwaitsecs = 30
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:scheduler]
command = supercronic -quiet -no-reap -overlapping /etc/supercronic/laravel
user = laravel
priority = 2
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:queue]
command = php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user = laravel
priority = 3
autorestart = true
stopwaitsecs = 60
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true
