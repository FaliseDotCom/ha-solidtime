# PostgreSQL settings for the Solidtime app. This file replaces the
# postgresql.conf in the data directory; anything not set here uses the
# PostgreSQL default. Tuned for small devices such as a Raspberry Pi.

# Only Solidtime, inside this container, ever connects.
listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/run/postgresql'
hba_file = '/data/postgres/pg_hba.conf'
ident_file = '/data/postgres/pg_ident.conf'

# Solidtime holds one connection per web worker, plus the queue worker and the
# scheduler. 50 leaves plenty of headroom on any supported device.
max_connections = 50
shared_buffers = 64MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 256MB

# Logs go to the app log in Home Assistant.
logging_collector = off
log_destination = 'stderr'
log_timezone = 'UTC'
log_min_messages = warning
log_checkpoints = off

timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
